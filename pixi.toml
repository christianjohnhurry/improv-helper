[workspace]
channels = ["conda-forge"]
name = "improv-helper"
platforms = ["osx-64", "osx-arm64", "linux-aarch64"]
version = "0.1.0"

[tasks]
test = "pytest"
scenes = "python -m flower.server"

[dependencies]
numpy = ">=2.3.3,<3"
pandas = ">=2.3.3,<3"
networkx = ">=3.5,<4"
pytest = ">=8"
python = ">=3.11"
fastapi = ">=0.143.0,<0.144"
uvicorn = ">=0.54.0,<0.55"
httpx = ">=0.28.1,<0.29"
plotly = ">=6,<7"

[pypi-dependencies]
flower = { path = ".", editable = true }
